{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-pagina-jogadores"> <h1>Excluir Jogador</h1>
    <p>Tem certeza que deseja excluir <strong>{{ jogador.nome }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #c1272d; color: white;">Sim, excluir</button>
        <a href="{% url 'lista_jogadores' %}" class="btn-outline">Cancelar</a>
    </form>
</div>
{% endblock %}
